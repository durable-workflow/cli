name: SonarQube maintenance

on:
  push:
    branches: [maintenance/2.3.6-base]

permissions:
  contents: read

concurrency:
  group: sonar-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: SonarQube analysis
    if: github.event_name == 'push' && github.ref == 'refs/heads/maintenance/2.3.6-base'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=false -Dsonar.qualitygate.timeout=300
