name: Release

run-name: >-
  ${{
    ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
     github.event_name == 'schedule' ||
     inputs.operation == 'phpmicro-cache-warm') &&
    'Warm phpmicro cache' ||
    format('Release {0}', inputs.tag || github.ref_name)
  }}

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
    paths:
      - '.github/workflows/release.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Trusted operation to perform from main'
        required: true
        type: choice
        options:
          - release
          - phpmicro-cache-warm
        default: release
      tag:
        description: 'Release tag required for release (e.g. 0.0.1-test or v0.0.1-test)'
        required: false
      release_commit:
        description: 'Exact source commit to release'
        required: false
permissions:
  contents: read

concurrency:
  group: >-
    ${{
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'schedule' ||
       inputs.operation == 'phpmicro-cache-warm') &&
      'phpmicro-cache-warm' ||
      format('release-{0}', inputs.tag || github.ref_name)
    }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve release tag
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      cache_warm: ${{ steps.resolve.outputs.cache_warm }}
      control_ref: ${{ steps.resolve.outputs.control_ref }}
      control_commit: ${{ steps.resolve.outputs.control_commit }}
      initiator: ${{ steps.resolve.outputs.initiator }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ github.sha }}
      - id: resolve
        shell: bash
        env:
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_COMMIT: ${{ inputs.release_commit }}
          PUSH_COMMIT: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
          CONTROL_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cache_warm=false
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] ||
              { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$CONTROL_REF" = "refs/heads/main" ]; } ||
              { [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
                [ "$DISPATCH_OPERATION" = "phpmicro-cache-warm" ]; }; then
            if [ "$CONTROL_REF" != "refs/heads/main" ]; then
              echo "::error::phpmicro cache warming must execute from refs/heads/main"
              exit 1
            fi
            cache_warm=true
            tag=""
            commit="$CONTROL_COMMIT"
            prerelease="false"
            make_latest="false"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            commit="$DISPATCH_COMMIT"
            if [ "$CONTROL_REF" != "refs/heads/main" ]; then
              echo "::error::Protected release dispatch must execute from refs/heads/main"
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
            commit="$PUSH_COMMIT"
          fi

          if [ "$cache_warm" != "true" ] && [ -z "$tag" ]; then
            echo "::error::Release tag is required for manual dispatch"
            exit 1
          fi

          if [ "$cache_warm" != "true" ]; then
            raw_tag="$tag"
            if ! tag="$(node scripts/ci/release-version.js normalize "$raw_tag")"; then
              echo "::error::Invalid release tag: $raw_tag"
              exit 1
            fi
            release_metadata="$(node scripts/ci/release-version.js metadata "$tag")"
            read -r prerelease make_latest <<< "$release_metadata"
            if [ "$tag" = "2.0.0" ]; then
              if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
                echo "::error::Stable 2.0.0 publication requires a protected main-branch dispatch"
                exit 1
              fi
            fi
          fi
          if ! printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Source commit must be a full lowercase Git commit SHA"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "cache_warm=$cache_warm" >> "$GITHUB_OUTPUT"
          echo "control_ref=$CONTROL_REF" >> "$GITHUB_OUTPUT"
          echo "control_commit=$CONTROL_COMMIT" >> "$GITHUB_OUTPUT"
          echo "initiator=$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          if [ "$cache_warm" = "true" ]; then
            echo "Resolved trusted phpmicro cache warm at $commit"
          else
            echo "Resolved release tag $tag at immutable commit $commit"
          fi

      - name: Record release control and package authorities
        if: steps.resolve.outputs.cache_warm != 'true'
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.resolve.outputs.commit }}
          CONTROL_REF: ${{ steps.resolve.outputs.control_ref }}
          CONTROL_COMMIT: ${{ steps.resolve.outputs.control_commit }}
          INITIATOR: ${{ steps.resolve.outputs.initiator }}
          RELEASE_PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          fs.writeFileSync('release-control-authority.json', `${JSON.stringify({
            schema: 'durable-workflow.cli.release-control-authority/v1',
            initiator: process.env.INITIATOR,
            control: {ref: process.env.CONTROL_REF, commit: process.env.CONTROL_COMMIT},
            package: {tag: process.env.RELEASE_TAG, commit: process.env.RELEASE_COMMIT},
            classification: {
              prerelease: process.env.RELEASE_PRERELEASE === 'true',
            },
          }, null, 2)}\n`);
          NODE

      - name: Retain release control authority
        if: steps.resolve.outputs.cache_warm != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-control-authority
          path: release-control-authority.json
          if-no-files-found: error

  release-preflight:
    name: Release preflight
    needs: resolve-release
    if: needs.resolve-release.outputs.cache_warm != 'true'
    runs-on: ubuntu-latest
    outputs:
      public_assets_present: ${{ steps.public_assets.outputs.present }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Checkout qualified release policy authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.control_commit }}
          path: release-control
          persist-credentials: false

      - name: Verify expected release source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: release-control/scripts/ci/verify-release-tag-source.sh

      - name: Inspect existing public release assets
        id: public_assets
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          release_repo="${DURABLE_WORKFLOW_REPO:-durable-workflow/cli}"
          evidence="release-preflight-public-assets-evidence.json"
          present="false"
          status="missing_or_incomplete"
          message="No complete public CLI asset set was found for ${tag}."

          if DURABLE_WORKFLOW_RELEASE_ASSET_ATTEMPTS=1 DURABLE_WORKFLOW_RELEASE_ASSET_RETRY_SLEEP=0 \
              release-control/scripts/verify-public-release-assets.sh "$tag"; then
            present="true"
            status="present"
            message="A complete public CLI asset set is already downloadable for ${tag}."
          fi

          echo "present=${present}" >> "$GITHUB_OUTPUT"

          checked_at="$(date -u +%FT%TZ)"
          node - "$evidence" "$tag" "$release_repo" "$status" "$message" "$checked_at" "$present" <<'NODE'
          const fs = require('fs');

          const [path, tag, repo, status, message, checkedAt, present] = process.argv.slice(2);
          const assets = [
            'dw.phar',
            'dw-linux-x86_64',
            'dw-linux-aarch64',
            'dw-macos-aarch64',
            'dw-windows-x86_64.exe',
            'dw.rb',
            'install.sh',
            'install.ps1',
            'verify-release.sh',
            'SHA256SUMS',
          ];

          const urls = assets.map((asset) => ({
            name: asset,
            url: `https://github.com/${repo}/releases/download/${tag}/${asset}`,
          }));

          fs.writeFileSync(path, `${JSON.stringify({
            schema: 'durable-workflow.cli.public-release-assets-preflight',
            tag,
            repository: repo,
            checked_at: checkedAt,
            outcome: status,
            message,
            purpose: present === 'true'
              ? 'existing-public-assets-rerun-gate'
              : 'pre-upload-public-asset-presence-check',
            installable_artifacts: {
              complete_public_asset_set: present === 'true',
              version: tag,
            },
            assets: urls,
          }, null, 2)}\n`);
          NODE

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              printf '## Public CLI asset preflight\n\n'
              printf '%s\n\n' "$message"
              if [ "$present" = "true" ]; then
                printf '%s' 'Because the complete public asset set already exists, '
                printf '%s\n' 'the live docs release-audit gate runs before any rebuild or upload.'
              else
                printf 'The live docs release-audit gate will run after this release publishes and verifies the public download surface.\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require live docs release audit for existing public assets
        if: steps.public_assets.outputs.present == 'true'
        env:
          DOCS_RELEASE_AUDIT_ARTIFACT: cli
          DOCS_RELEASE_AUDIT_VERSION: ${{ needs.resolve-release.outputs.tag }}
          DOCS_RELEASE_AUDIT_EVIDENCE: docs-release-audit-evidence.json
          DOCS_RELEASE_AUDIT_HANDOFF: docs-release-audit-handoff.json
          DOCS_RELEASE_AUDIT_STALE_MODE: advisory
        run: release-control/scripts/ci/check-docs-release-audit.sh

      - name: Upload release preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-preflight-evidence
          path: |
            release-preflight-public-assets-evidence.json
            docs-release-audit-evidence.json
            docs-release-audit-handoff.json
          if-no-files-found: warn

  reconcile-existing-release-metadata:
    name: Reconcile existing GitHub Release metadata
    needs: [resolve-release, release-preflight]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.resolve-release.outputs.cache_warm != 'true' &&
      always() &&
      needs.resolve-release.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      needs.release-preflight.outputs.public_assets_present == 'true'
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.control_commit }}
          persist-credentials: false

      - name: Reconcile metadata without replacing the tag or assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: scripts/ci/reconcile-release-metadata.sh "$RELEASE_TAG"

      - name: Verify reconciled public metadata
        env:
          EXPECTED_PRERELEASE: ${{ needs.resolve-release.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          observed="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '[.tag_name, (.draft | tostring), (.prerelease | tostring)] | @tsv'
          )"
          expected="${RELEASE_TAG}"$'\t'"false"$'\t'"${EXPECTED_PRERELEASE}"
          if [ "$observed" != "$expected" ]; then
            echo "::error::Public release metadata does not match ${expected}: ${observed}"
            exit 1
          fi

  build-phar:
    name: Build PHAR
    needs: [resolve-release, release-preflight]
    runs-on: ubuntu-latest
    if: >-
      needs.resolve-release.outputs.cache_warm != 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main') &&
      always() &&
      needs.resolve-release.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      needs.release-preflight.outputs.public_assets_present != 'true'
    outputs:
      phar-name: dw.phar
    env:
      BOX_VERSION: '4.6.6'
      GITHUB_TOKEN: ${{ github.token }}
      PHP_VERSION: '8.4'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2, box:${{ env.BOX_VERSION }}
          coverage: none
          ini-values: phar.readonly=0

      - name: Pin SOURCE_DATE_EPOCH for reproducible build
        run: |
          # Pin the build clock to the tag-pointed commit so the PHAR
          # produced here matches the PHAR an operator rebuilds locally
          # from the same tag. See docs/distribution.md.
          epoch=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH pinned to $epoch ($(date -u -d "@$epoch" +%FT%TZ))"

      - name: Generate build metadata
        env:
          DW_CLI_VERSION: ${{ needs.resolve-release.outputs.tag }}
        run: |
          export DW_CLI_COMMIT="$(git rev-parse HEAD)"
          php scripts/generate-build-info.php

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Normalize input mtimes for reproducible PHAR
        run: |
          # Box hashes archive entry mtimes. Pinning them to the build
          # epoch (which is itself the commit time) makes the PHAR's
          # entry table deterministic across reruns of the same tag.
          find src schemas bin vendor -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          [ -f src/GeneratedBuildInfo.php ] && touch -h -d "@$SOURCE_DATE_EPOCH" src/GeneratedBuildInfo.php

      - name: Build PHAR
        run: box compile --no-parallel

      - name: Verify PHAR
        run: |
          php build/dw.phar --version || true
          box info build/dw.phar

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dw-phar
          path: build/dw.phar
          if-no-files-found: error

  build-binary:
    name: Build ${{ matrix.name }}
    needs: [resolve-release, release-preflight, build-phar]
    if: >-
      always() &&
      needs.resolve-release.result == 'success' &&
      (needs.resolve-release.outputs.cache_warm == 'true' ||
       (needs.release-preflight.result == 'success' &&
        needs.release-preflight.outputs.public_assets_present != 'true' &&
        needs.build-phar.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            spc_asset: spc-linux-x86_64.tar.gz
            spc_sha256: 523ba4279c54c7a377156c0dd3a36adf92ee64b01e9a7f5e9e2ec084b8e458e5
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            spc_asset: spc-linux-aarch64.tar.gz
            spc_sha256: 675a3840dcdc4ed041fe20eaa54310ce019a9984c1c03951df9ec66df5795213
          - name: macos-aarch64
            runner: macos-14
            spc_asset: spc-macos-aarch64.tar.gz
            spc_sha256: acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MUSL_SHA256: a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4
      MUSL_VERSION: '1.2.5'
      NATIVE_PREREQUISITE_CACHE_SCHEMA: 'v1'
      PHP_VERSION: '8.4.23'
      PHPMICRO_CACHE_SCHEMA: 'v1'
      PHPMICRO_UNCACHED_BASELINE_SECONDS: '480'
      SPC_DOWNLOAD_OUTER_ATTEMPTS: '4'
      SPC_DOWNLOAD_RETRY: '5'
      SPC_EXTENSIONS: curl,mbstring,openssl,phar,tokenizer,ctype,filter,fileinfo,iconv,sockets
      SPC_REVISION: 4318ef8fa32a02460ec1554746674a7bc42b49fa
      SPC_VERSION: '2.8.5'
      STANDALONE_RUNTIME_EXTENSIONS: curl,mbstring,openssl,phar,tokenizer,ctype,filter,fileinfo,iconv,sockets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Checkout qualified phpmicro toolchain policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.control_commit }}
          path: release-toolchain-control
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/release.yml
            scripts/ci/establish-native-prerequisites.sh
          sparse-checkout-cone-mode: false

      - name: Download PHAR artifact
        if: needs.resolve-release.outputs.cache_warm != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dw-phar
          path: build/

      - name: Start phpmicro toolchain timing
        id: phpmicro-timing-start
        shell: bash
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Download and verify pinned spc
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/.tools
          archive="build/.tools/${{ matrix.spc_asset }}"
          rm -f "$archive" build/.tools/spc
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
                -o "$archive" \
                "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/${{ matrix.spc_asset }}"; then
              break
            fi
            echo "spc download attempt $attempt failed, retrying in 10s..."
            rm -f "$archive"
            sleep 10
          done

          test -s "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          else
            actual_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          if [ "$actual_sha256" != "${{ matrix.spc_sha256 }}" ]; then
            echo "::error::Pinned spc archive checksum mismatch"
            rm -f "$archive"
            exit 1
          fi

          tar -xzf "$archive" -C build/.tools
          rm -f "$archive"
          test -s build/.tools/spc
          chmod +x build/.tools/spc
          version_output="$(build/.tools/spc --version)"
          case "$version_output" in
            *"$SPC_VERSION"*) printf '%s\n' "$version_output" ;;
            *)
              echo "::error::Verified spc binary did not report version $SPC_VERSION"
              exit 1
              ;;
          esac

      - name: Restore trusted native prerequisite cache
        id: native-prerequisite-cache
        if: >-
          runner.os == 'Linux' &&
          github.repository == 'durable-workflow/cli' &&
          github.event_name != 'pull_request' &&
          ((needs.resolve-release.outputs.cache_warm == 'true' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch')) ||
           (needs.resolve-release.outputs.cache_warm != 'true' &&
            ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
             (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))))
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: build/.tools/native-prerequisite-cache/musl-${{ env.MUSL_VERSION }}.tar.gz
          key: native-prerequisite-${{ env.NATIVE_PREREQUISITE_CACHE_SCHEMA }}-musl-${{ env.MUSL_VERSION }}-${{ env.MUSL_SHA256 }}

      - name: Establish and verify native build prerequisites
        id: native-prerequisites
        working-directory: build/.tools
        shell: bash
        run: |
          set -euo pipefail
          sha256_stdin() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum | awk '{print $1}'
            else
              shasum -a 256 | awk '{print $1}'
            fi
          }

          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install --no-install-recommends -y build-essential pkg-config
              compiler=cc
              ;;
            macOS)
              brew install pkgconf
              compiler=clang
              ;;
            *)
              echo "::error::Unsupported native build platform: ${{ runner.os }}"
              exit 1
              ;;
          esac

          NATIVE_PREREQUISITE_EVIDENCE=native-prerequisite-evidence.json \
            ../../release-toolchain-control/scripts/ci/establish-native-prerequisites.sh \
            "${{ runner.os }}" "${{ runner.arch }}" ./spc native-prerequisite-cache
          for tool in "$compiler" make pkg-config tar; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required native build tool is unavailable: $tool"
              exit 1
            fi
          done

          case "${{ runner.os }}" in
            Linux)
              package_identity="$(
                dpkg-query -W -f='${Package}=${Version}\n' | sort
              )"
              ;;
            macOS)
              package_identity="$(brew list --versions | sort)"
              ;;
          esac
          native_toolchain_id="$(
            {
              printf '%s\n' "$package_identity"
              "$compiler" --version | sed -n '1p'
              make --version | sed -n '1p'
              pkg-config --version
              tar --version | sed -n '1p'
            } | sha256_stdin
          )"
          echo "toolchain_id=$native_toolchain_id" >> "$GITHUB_OUTPUT"

      - name: Resolve exact phpmicro cache identity
        id: phpmicro-toolchain
        shell: bash
        run: |
          set -euo pipefail
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          sha256_stdin() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum | awk '{print $1}'
            else
              shasum -a 256 | awk '{print $1}'
            fi
          }

          if [ -z "${ImageOS:-}" ] || [ -z "${ImageVersion:-}" ]; then
            echo "::error::GitHub-hosted runner image identity is unavailable"
            exit 1
          fi

          workflow_sha="$(sha256_file release-toolchain-control/.github/workflows/release.yml)"
          native_prerequisite_script_sha="$(
            sha256_file release-toolchain-control/scripts/ci/establish-native-prerequisites.sh
          )"
          extensions_sha="$(printf '%s' "$SPC_EXTENSIONS" | sha256_stdin)"
          runner_image="${ImageOS}-${ImageVersion}"
          toolchain_id="$(
            printf '%s\n' \
              "schema=$PHPMICRO_CACHE_SCHEMA" \
              "spc_version=$SPC_VERSION" \
              "spc_revision=$SPC_REVISION" \
              "php_version=$PHP_VERSION" \
              "extensions=$SPC_EXTENSIONS" \
              "native_toolchain_id=${{ steps.native-prerequisites.outputs.toolchain_id }}" \
              "native_prerequisite_identity=${{ steps.native-prerequisites.outputs.identity }}" \
              "native_prerequisite_script_sha256=$native_prerequisite_script_sha" \
              "workflow_sha256=$workflow_sha" \
              "runner_label=${{ matrix.runner }}" \
              "runner_os=${{ runner.os }}" \
              "runner_arch=${{ runner.arch }}" \
              "runner_image=$runner_image" |
              sha256_stdin
          )"

          echo "workflow_sha=$workflow_sha" >> "$GITHUB_OUTPUT"
          echo "extensions_sha=$extensions_sha" >> "$GITHUB_OUTPUT"
          echo "native_prerequisite_script_sha=$native_prerequisite_script_sha" >> "$GITHUB_OUTPUT"
          echo "runner_image=$runner_image" >> "$GITHUB_OUTPUT"
          echo "toolchain_id=$toolchain_id" >> "$GITHUB_OUTPUT"

      - name: Restore trusted phpmicro cache
        id: phpmicro-cache
        if: >-
          github.repository == 'durable-workflow/cli' &&
          github.event_name != 'pull_request' &&
          ((needs.resolve-release.outputs.cache_warm == 'true' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch')) ||
           (needs.resolve-release.outputs.cache_warm != 'true' &&
            ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
             (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))))
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            build/.tools/buildroot/bin/micro.sfx
            build/.tools/phpmicro-cache.manifest
          key: phpmicro-${{ env.PHPMICRO_CACHE_SCHEMA }}-${{ steps.phpmicro-toolchain.outputs.toolchain_id }}

      - name: Validate restored phpmicro provenance
        id: verify-phpmicro-cache
        working-directory: build/.tools
        shell: bash
        env:
          CACHE_HIT: ${{ steps.phpmicro-cache.outputs.cache-hit }}
          TOOLCHAIN_ID: ${{ steps.phpmicro-toolchain.outputs.toolchain_id }}
        run: |
          set -euo pipefail
          micro="buildroot/bin/micro.sfx"
          manifest="phpmicro-cache.manifest"
          echo "cache_valid=false" >> "$GITHUB_OUTPUT"

          if [ "$CACHE_HIT" != "true" ]; then
            rm -rf buildroot
            rm -f "$manifest"
            exit 0
          fi

          valid=true
          if [ ! -s "$micro" ] || [ ! -s "$manifest" ]; then
            valid=false
          else
            expected_manifest="$(
              printf '%s\n' \
                "schema=durable-workflow.phpmicro-cache/v1" \
                "toolchain_id=$TOOLCHAIN_ID" \
                "sha256=$(sed -n 's/^sha256=//p' "$manifest")"
            )"
            if [ "$(cat "$manifest")" != "$expected_manifest" ]; then
              valid=false
            else
              expected_sha256="$(sed -n 's/^sha256=//p' "$manifest")"
              if command -v sha256sum >/dev/null 2>&1; then
                actual_sha256="$(sha256sum "$micro" | awk '{print $1}')"
              else
                actual_sha256="$(shasum -a 256 "$micro" | awk '{print $1}')"
              fi
              if [ "$actual_sha256" != "$expected_sha256" ]; then
                valid=false
              fi
            fi
          fi

          if [ "$valid" != "true" ]; then
            echo "::warning::Discarding untrusted or invalid phpmicro cache; rebuilding cleanly"
            rm -rf buildroot
            rm -f "$manifest"
            exit 0
          fi

          echo "cache_valid=true" >> "$GITHUB_OUTPUT"

      - name: Fetch PHP sources & extension deps on cold build
        if: steps.verify-phpmicro-cache.outputs.cache_valid != 'true'
        working-directory: build/.tools
        shell: bash
        run: |
          set -euo pipefail
          # Keep the SHA-256-verified musl archive and lock established above.
          # This remains the trusted input to spc download on a cold build.
          rm -rf source buildroot
          case "$SPC_DOWNLOAD_OUTER_ATTEMPTS" in
            ''|*[!0-9]*)
              echo "::error::SPC_DOWNLOAD_OUTER_ATTEMPTS must be a positive integer"
              exit 1
              ;;
          esac
          if [ "$SPC_DOWNLOAD_OUTER_ATTEMPTS" -lt 1 ]; then
            echo "::error::SPC_DOWNLOAD_OUTER_ATTEMPTS must be at least 1"
            exit 1
          fi

          attempt=1
          while [ "$attempt" -le "$SPC_DOWNLOAD_OUTER_ATTEMPTS" ]; do
            if ./spc download --with-php=${{ env.PHP_VERSION }} \
                --for-extensions="$SPC_EXTENSIONS" --prefer-pre-built \
                --without-suggestions --retry="${SPC_DOWNLOAD_RETRY}"; then
              exit 0
            fi

            if [ "$attempt" -lt "$SPC_DOWNLOAD_OUTER_ATTEMPTS" ]; then
              delay=$((attempt * 30))
              echo "::warning::spc dependency download attempt ${attempt}/${SPC_DOWNLOAD_OUTER_ATTEMPTS} failed; retrying in ${delay}s"
              sleep "$delay"
            fi
            attempt=$((attempt + 1))
          done

          echo "::error::spc dependency download failed after ${SPC_DOWNLOAD_OUTER_ATTEMPTS} attempts"
          exit 1

      - name: Build and bind phpmicro on cold build
        if: steps.verify-phpmicro-cache.outputs.cache_valid != 'true'
        working-directory: build/.tools
        shell: bash
        env:
          TOOLCHAIN_ID: ${{ steps.phpmicro-toolchain.outputs.toolchain_id }}
        run: |
          set -euo pipefail
          ./spc build "$SPC_EXTENSIONS" --build-micro
          test -s buildroot/bin/micro.sfx
          if command -v sha256sum >/dev/null 2>&1; then
            micro_sha256="$(sha256sum buildroot/bin/micro.sfx | awk '{print $1}')"
          else
            micro_sha256="$(shasum -a 256 buildroot/bin/micro.sfx | awk '{print $1}')"
          fi
          printf '%s\n' \
            "schema=durable-workflow.phpmicro-cache/v1" \
            "toolchain_id=$TOOLCHAIN_ID" \
            "sha256=$micro_sha256" \
            > phpmicro-cache.manifest

      - name: Record phpmicro toolchain timing
        if: always()
        working-directory: build/.tools
        shell: bash
        env:
          CACHE_HIT: ${{ steps.phpmicro-cache.outputs.cache-hit }}
          CACHE_VALID: ${{ steps.verify-phpmicro-cache.outputs.cache_valid }}
          CACHE_KEY: phpmicro-${{ env.PHPMICRO_CACHE_SCHEMA }}-${{ steps.phpmicro-toolchain.outputs.toolchain_id }}
          CACHE_SCOPE: ${{ needs.resolve-release.outputs.cache_warm == 'true' && 'default-branch' || (startsWith(github.ref, 'refs/tags/') && 'release-tag' || 'default-branch-release') }}
          GIT_REF: ${{ github.ref }}
          PLATFORM: ${{ matrix.name }}
          RUN_PURPOSE: ${{ needs.resolve-release.outputs.cache_warm == 'true' && 'cache-warm' || 'release' }}
          STARTED_AT: ${{ steps.phpmicro-timing-start.outputs.started_at }}
          NATIVE_PREREQUISITE_IDENTITY: ${{ steps.native-prerequisites.outputs.identity }}
          NATIVE_PREREQUISITE_MODE: ${{ steps.native-prerequisites.outputs.mode }}
          NATIVE_PREREQUISITE_SOURCE: ${{ steps.native-prerequisites.outputs.source }}
        run: |
          set -euo pipefail
          finished_at="$(date +%s)"
          elapsed_seconds=$((finished_at - STARTED_AT))
          cache_mode="cold"
          if [ "$CACHE_VALID" = "true" ]; then
            cache_mode="warm"
          elif [ "$CACHE_HIT" = "true" ]; then
            cache_mode="cold-fallback"
          fi
          outcome="failure"
          if [ -s buildroot/bin/micro.sfx ] && [ -s phpmicro-cache.manifest ]; then
            outcome="success"
          fi

          node - \
            "$cache_mode" \
            "$outcome" \
            "$elapsed_seconds" \
            "$PHPMICRO_UNCACHED_BASELINE_SECONDS" \
            "$CACHE_KEY" \
            "$CACHE_SCOPE" \
            "$GIT_REF" \
            "$PLATFORM" \
            "$RUN_PURPOSE" \
            "$NATIVE_PREREQUISITE_IDENTITY" \
            "$NATIVE_PREREQUISITE_MODE" \
            "$NATIVE_PREREQUISITE_SOURCE" <<'NODE'
          const fs = require('fs');
          const [
            cacheMode,
            outcome,
            elapsedSeconds,
            baselineSeconds,
            cacheKey,
            cacheScope,
            gitRef,
            platform,
            runPurpose,
            nativePrerequisiteIdentity,
            nativePrerequisiteMode,
            nativePrerequisiteSource,
          ] = process.argv.slice(2);
          fs.writeFileSync('phpmicro-timing.json', `${JSON.stringify({
            schema: 'durable-workflow.cli.phpmicro-toolchain-timing/v2',
            cache_mode: cacheMode,
            cache_key: cacheKey,
            cache_scope: cacheScope,
            git_ref: gitRef,
            outcome,
            platform,
            run_purpose: runPurpose,
            native_prerequisite: {
              identity: nativePrerequisiteIdentity,
              cache_mode: nativePrerequisiteMode,
              source: nativePrerequisiteSource,
            },
            elapsed_seconds: Number(elapsedSeconds),
            previous_uncached_baseline_seconds: Number(baselineSeconds),
          }, null, 2)}\n`);
          NODE

          {
            printf '## phpmicro toolchain timing (%s)\n\n' '${{ matrix.name }}'
            printf '| Measurement | Seconds |\n'
            printf '| --- | ---: |\n'
            printf '| Previous uncached baseline | %s |\n' "$PHPMICRO_UNCACHED_BASELINE_SECONDS"
            printf '| This run (%s) | %s |\n\n' "$cache_mode" "$elapsed_seconds"
            printf 'Native prerequisite: `%s` (%s from `%s`).\n\n' \
              "$NATIVE_PREREQUISITE_IDENTITY" \
              "$NATIVE_PREREQUISITE_MODE" \
              "$NATIVE_PREREQUISITE_SOURCE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload spc build logs (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ${{ matrix.name }}-spc-logs
          path: |
            build/.tools/log/
            build/.tools/native-prerequisite-evidence.json
            build/.tools/phpmicro-timing.json
          if-no-files-found: warn

      - name: Combine PHAR into standalone binary
        if: needs.resolve-release.outputs.cache_warm != 'true'
        working-directory: build/.tools
        run: |
          ./spc micro:combine ../../build/dw.phar \
            --output=../../build/dw-${{ matrix.name }}

      - name: Smoke test binary
        if: needs.resolve-release.outputs.cache_warm != 'true'
        run: |
          chmod +x build/dw-${{ matrix.name }}
          ./build/dw-${{ matrix.name }} --version
          ./build/dw-${{ matrix.name }} runtime:check
          ./build/dw-${{ matrix.name }} list

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: needs.resolve-release.outputs.cache_warm != 'true'
        with:
          name: dw-${{ matrix.name }}
          path: build/dw-${{ matrix.name }}
          if-no-files-found: error

  build-binary-windows:
    name: Build windows-x86_64
    needs: [resolve-release, release-preflight, build-phar]
    if: >-
      always() &&
      needs.resolve-release.result == 'success' &&
      (needs.resolve-release.outputs.cache_warm == 'true' ||
       (needs.release-preflight.result == 'success' &&
        needs.release-preflight.outputs.public_assets_present != 'true' &&
        needs.build-phar.result == 'success'))
    runs-on: windows-2022
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PHP_VERSION_WINDOWS: '8.4.23'
      PHPMICRO_CACHE_SCHEMA: 'v1'
      PHPMICRO_UNCACHED_BASELINE_SECONDS: '480'
      SPC_DOWNLOAD_OUTER_ATTEMPTS: '4'
      SPC_DOWNLOAD_RETRY: '5'
      SPC_REVISION: 4318ef8fa32a02460ec1554746674a7bc42b49fa
      SPC_VERSION: '2.8.5'
      SPC_WINDOWS_SHA256: 425b54ab857e21409c1fd9b818899ffebabd1e2817ef0a0ed5ae8a3d9f5b463b
      # Windows uses Symfony's native stream transport over OpenSSL. Avoid ext-curl because
      # the generated micro runtime can compile successfully without loading the extension.
      SPC_EXTENSIONS_WINDOWS: mbstring,openssl,phar,tokenizer,ctype,filter,fileinfo,iconv,sockets
      STANDALONE_RUNTIME_EXTENSIONS_WINDOWS: mbstring,openssl,phar,tokenizer,ctype,filter,fileinfo,iconv,sockets
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Checkout qualified phpmicro toolchain policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.control_commit }}
          path: release-toolchain-control
          persist-credentials: false
          sparse-checkout: .github/workflows/release.yml
          sparse-checkout-cone-mode: false

      - name: Download PHAR artifact
        if: needs.resolve-release.outputs.cache_warm != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dw-phar
          path: build/

      - name: Start phpmicro toolchain timing
        id: phpmicro-timing-start
        shell: pwsh
        run: |
          "started_at=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT

      - name: Download and verify pinned spc
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\.tools -Force | Out-Null
          $spcPath = "build\.tools\spc.exe"
          Remove-Item -Force $spcPath -ErrorAction SilentlyContinue
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            curl.exe -fsSL --retry 3 --retry-all-errors --connect-timeout 10 `
              -o $spcPath `
              "https://github.com/crazywhalecc/static-php-cli/releases/download/$env:SPC_VERSION/spc-windows-x64.exe"
            if ($LASTEXITCODE -eq 0) {
              break
            }
            Write-Warning "spc download attempt $attempt failed, retrying in 10s"
            Remove-Item -Force $spcPath -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 10
          }

          if (-not (Test-Path $spcPath -PathType Leaf)) {
            Write-Error "Pinned spc binary download failed"
            exit 1
          }
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $spcPath).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $env:SPC_WINDOWS_SHA256) {
            Remove-Item -Force $spcPath
            Write-Error "Pinned spc binary checksum mismatch"
            exit 1
          }

          $versionOutput = & $spcPath --version
          if ($LASTEXITCODE -ne 0 -or "$versionOutput" -notlike "*$env:SPC_VERSION*") {
            Write-Error "Verified spc binary did not report version $env:SPC_VERSION"
            exit 1
          }
          Write-Host $versionOutput

      - name: Establish and verify native build prerequisites
        id: native-prerequisites
        shell: pwsh
        working-directory: build\.tools
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere -PathType Leaf)) {
            Write-Error "Visual Studio discovery tool is unavailable"
            exit 1
          }

          $vsInstallPath = & $vswhere -latest -products "*" -version "[17.0,18.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace("$vsInstallPath")) {
            Write-Error "Visual Studio 2022 with the x64 C++ toolchain is unavailable"
            exit 1
          }

          $vsVersion = & $vswhere -latest -products "*" -version "[17.0,18.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion | Select-Object -First 1
          $compiler = Get-ChildItem `
            "$vsInstallPath\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" `
            -File | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $compiler) {
            Write-Error "Visual Studio 2022 x64 compiler is unavailable"
            exit 1
          }

          .\spc.exe doctor --auto-fix
          if ($LASTEXITCODE -ne 0) {
            Write-Error "static-php-cli could not establish its native build prerequisites"
            exit 1
          }

          $sevenZip = "php-sdk-binary-tools\bin\7za.exe"
          if (-not (Test-Path $sevenZip -PathType Leaf)) {
            Write-Error "static-php-cli PHP source extraction tool is unavailable"
            exit 1
          }
          $tar = (Get-Command tar.exe -ErrorAction Stop).Source

          $sdkToolIdentity = Get-ChildItem php-sdk-binary-tools -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relativePath = [IO.Path]::GetRelativePath(
                (Get-Location).Path,
                $_.FullName
              )
              "$relativePath=$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())"
            }
          $identity = @(
            "visual_studio=$vsVersion"
            "compiler_sha256=$((Get-FileHash -Algorithm SHA256 $compiler.FullName).Hash.ToLowerInvariant())"
            "tar_sha256=$((Get-FileHash -Algorithm SHA256 $tar).Hash.ToLowerInvariant())"
            $sdkToolIdentity
          ) -join "`n"
          $identityBytes = [Text.Encoding]::UTF8.GetBytes("$identity`n")
          $nativeToolchainId = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($identityBytes)
          ).ToLowerInvariant()
          "toolchain_id=$nativeToolchainId" >> $env:GITHUB_OUTPUT

      - name: Resolve exact phpmicro cache identity
        id: phpmicro-toolchain
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            Write-Error "GitHub-hosted runner image identity is unavailable"
            exit 1
          }

          $workflowSha = (
            Get-FileHash -Algorithm SHA256 release-toolchain-control\.github\workflows\release.yml
          ).Hash.ToLowerInvariant()
          $extensionsBytes = [Text.Encoding]::UTF8.GetBytes($env:SPC_EXTENSIONS_WINDOWS)
          $extensionsSha = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($extensionsBytes)
          ).ToLowerInvariant()
          $runnerImage = "$env:ImageOS-$env:ImageVersion"
          $identity = @(
            "schema=$env:PHPMICRO_CACHE_SCHEMA"
            "spc_version=$env:SPC_VERSION"
            "spc_revision=$env:SPC_REVISION"
            "php_version=$env:PHP_VERSION_WINDOWS"
            "extensions=$env:SPC_EXTENSIONS_WINDOWS"
            "native_toolchain_id=${{ steps.native-prerequisites.outputs.toolchain_id }}"
            "workflow_sha256=$workflowSha"
            "runner_label=windows-2022"
            "runner_os=${{ runner.os }}"
            "runner_arch=${{ runner.arch }}"
            "runner_image=$runnerImage"
          ) -join "`n"
          $identityBytes = [Text.Encoding]::UTF8.GetBytes("$identity`n")
          $toolchainId = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($identityBytes)
          ).ToLowerInvariant()

          "workflow_sha=$workflowSha" >> $env:GITHUB_OUTPUT
          "extensions_sha=$extensionsSha" >> $env:GITHUB_OUTPUT
          "runner_image=$runnerImage" >> $env:GITHUB_OUTPUT
          "toolchain_id=$toolchainId" >> $env:GITHUB_OUTPUT

      - name: Restore trusted phpmicro cache
        id: phpmicro-cache
        if: >-
          github.repository == 'durable-workflow/cli' &&
          github.event_name != 'pull_request' &&
          ((needs.resolve-release.outputs.cache_warm == 'true' &&
            github.ref == 'refs/heads/main' &&
            (github.event_name == 'push' ||
             github.event_name == 'schedule' ||
             github.event_name == 'workflow_dispatch')) ||
           (needs.resolve-release.outputs.cache_warm != 'true' &&
            ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
             (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))))
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: |
            build/.tools/buildroot/bin/micro.sfx
            build/.tools/phpmicro-cache.manifest
          key: phpmicro-${{ env.PHPMICRO_CACHE_SCHEMA }}-${{ steps.phpmicro-toolchain.outputs.toolchain_id }}

      - name: Validate restored phpmicro provenance
        id: verify-phpmicro-cache
        shell: pwsh
        working-directory: build\.tools
        env:
          CACHE_HIT: ${{ steps.phpmicro-cache.outputs.cache-hit }}
          TOOLCHAIN_ID: ${{ steps.phpmicro-toolchain.outputs.toolchain_id }}
        run: |
          $micro = "buildroot\bin\micro.sfx"
          $manifest = "phpmicro-cache.manifest"
          "cache_valid=false" >> $env:GITHUB_OUTPUT
          $valid = $env:CACHE_HIT -eq "true"

          if ($valid -and (Test-Path $micro -PathType Leaf) -and (Test-Path $manifest -PathType Leaf)) {
            $actual = @(Get-Content $manifest)
            $valid = $actual.Count -eq 3
            if ($valid) {
              $valid = $actual[0] -eq "schema=durable-workflow.phpmicro-cache/v1" `
                -and $actual[1] -eq "toolchain_id=$env:TOOLCHAIN_ID" `
                -and $actual[2] -match '^sha256=[0-9a-f]{64}$'
            }
            if ($valid) {
              $expectedSha256 = $actual[2].Substring("sha256=".Length)
              $actualSha256 = (Get-FileHash -Algorithm SHA256 $micro).Hash.ToLowerInvariant()
              $valid = $actualSha256 -eq $expectedSha256
            }
          } else {
            $valid = $false
          }

          if (-not $valid) {
            if ($env:CACHE_HIT -eq "true") {
              Write-Warning "Discarding untrusted or invalid phpmicro cache; rebuilding cleanly"
            }
            Remove-Item -Recurse -Force buildroot -ErrorAction SilentlyContinue
            Remove-Item -Force $manifest -ErrorAction SilentlyContinue
            exit 0
          }

          "cache_valid=true" >> $env:GITHUB_OUTPUT

      - name: Fetch PHP sources & extension deps on cold build
        if: steps.verify-phpmicro-cache.outputs.cache_valid != 'true'
        shell: pwsh
        working-directory: build\.tools
        run: |
          Remove-Item -Recurse -Force downloads,source,buildroot -ErrorAction SilentlyContinue
          $outerAttempts = [int]$env:SPC_DOWNLOAD_OUTER_ATTEMPTS
          if ($outerAttempts -lt 1) {
            Write-Error "SPC_DOWNLOAD_OUTER_ATTEMPTS must be at least 1"
            exit 1
          }

          for ($attempt = 1; $attempt -le $outerAttempts; $attempt++) {
            .\spc.exe download --with-php=${{ env.PHP_VERSION_WINDOWS }} `
              --for-extensions="$env:SPC_EXTENSIONS_WINDOWS" --prefer-pre-built `
              --without-suggestions --retry="$env:SPC_DOWNLOAD_RETRY"
            if ($LASTEXITCODE -eq 0) {
              break
            }

            if ($attempt -lt $outerAttempts) {
              $delay = $attempt * 30
              Write-Warning "spc dependency download attempt $attempt/$outerAttempts failed; retrying in ${delay}s"
              Start-Sleep -Seconds $delay
            } else {
              Write-Error "spc dependency download failed after $outerAttempts attempts"
              exit $LASTEXITCODE
            }
          }

          Remove-Item -Recurse -Force source\php-src -ErrorAction SilentlyContinue
          .\spc.exe extract php-src
          if ($LASTEXITCODE -ne 0 `
            -or -not (Test-Path source\php-src\main\php_version.h -PathType Leaf)
          ) {
            Write-Error "static-php-cli did not extract a usable PHP source tree"
            exit 1
          }

      - name: Patch PHP OpenSSL 3 compatibility
        if: steps.verify-phpmicro-cache.outputs.cache_valid != 'true'
        shell: pwsh
        working-directory: build\.tools
        run: |
          @'
          import pathlib
          import re

          headers = list(pathlib.Path("source").rglob("php_openssl.h"))
          if not headers:
              print("php_openssl.h was not found after spc extract; continuing without local OpenSSL patch.")
              raise SystemExit(0)

          patched = []
          compat = "#ifndef ERR_NUM_ERRORS\n#define ERR_NUM_ERRORS 16\n#endif\n\n"
          for header in headers:
              text = header.read_text()
              if "ERR_NUM_ERRORS" not in text or "#define ERR_NUM_ERRORS 16" in text:
                  continue

              patched_text, count = re.subn(r"(#include\s+<openssl/err\.h>\r?\n)", r"\1" + compat, text, count=1)
              if count == 1:
                  text = patched_text
              else:
                  text = compat + text

              header.write_text(text)
              patched.append(str(header))

          if patched:
              print("Patched OpenSSL ERR_NUM_ERRORS compatibility in:")
              for path in patched:
                  print(f"  {path}")
          else:
              print("No ERR_NUM_ERRORS compatibility patch was needed.")
          '@ | Set-Content -Path patch-php-openssl.py -Encoding utf8
          python patch-php-openssl.py
          Remove-Item -Recurse -Force buildroot -ErrorAction SilentlyContinue

      - name: Build and bind phpmicro on cold build
        if: steps.verify-phpmicro-cache.outputs.cache_valid != 'true'
        shell: pwsh
        working-directory: build\.tools
        env:
          TOOLCHAIN_ID: ${{ steps.phpmicro-toolchain.outputs.toolchain_id }}
        run: |
          .\spc.exe build "$env:SPC_EXTENSIONS_WINDOWS" --build-micro --debug
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path buildroot\bin\micro.sfx -PathType Leaf)) {
            Write-Error "phpmicro build did not produce micro.sfx"
            exit 1
          }
          $microSha256 = (Get-FileHash -Algorithm SHA256 buildroot\bin\micro.sfx).Hash.ToLowerInvariant()
          @(
            "schema=durable-workflow.phpmicro-cache/v1"
            "toolchain_id=$env:TOOLCHAIN_ID"
            "sha256=$microSha256"
          ) | Set-Content -Path phpmicro-cache.manifest -Encoding ascii

      - name: Record phpmicro toolchain timing
        if: always()
        shell: pwsh
        working-directory: build\.tools
        env:
          CACHE_HIT: ${{ steps.phpmicro-cache.outputs.cache-hit }}
          CACHE_VALID: ${{ steps.verify-phpmicro-cache.outputs.cache_valid }}
          CACHE_KEY: phpmicro-${{ env.PHPMICRO_CACHE_SCHEMA }}-${{ steps.phpmicro-toolchain.outputs.toolchain_id }}
          CACHE_SCOPE: ${{ needs.resolve-release.outputs.cache_warm == 'true' && 'default-branch' || (startsWith(github.ref, 'refs/tags/') && 'release-tag' || 'default-branch-release') }}
          GIT_REF: ${{ github.ref }}
          PLATFORM: windows-x86_64
          RUN_PURPOSE: ${{ needs.resolve-release.outputs.cache_warm == 'true' && 'cache-warm' || 'release' }}
          STARTED_AT: ${{ steps.phpmicro-timing-start.outputs.started_at }}
        run: |
          $finishedAt = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $elapsedSeconds = $finishedAt - [long]$env:STARTED_AT
          $cacheMode = "cold"
          if ($env:CACHE_VALID -eq "true") {
            $cacheMode = "warm"
          } elseif ($env:CACHE_HIT -eq "true") {
            $cacheMode = "cold-fallback"
          }
          $outcome = if (
            (Test-Path buildroot\bin\micro.sfx -PathType Leaf) `
              -and (Test-Path phpmicro-cache.manifest -PathType Leaf)
          ) { "success" } else { "failure" }

          [ordered]@{
            schema = "durable-workflow.cli.phpmicro-toolchain-timing/v2"
            cache_mode = $cacheMode
            cache_key = $env:CACHE_KEY
            cache_scope = $env:CACHE_SCOPE
            git_ref = $env:GIT_REF
            outcome = $outcome
            platform = $env:PLATFORM
            run_purpose = $env:RUN_PURPOSE
            elapsed_seconds = $elapsedSeconds
            previous_uncached_baseline_seconds = [int]$env:PHPMICRO_UNCACHED_BASELINE_SECONDS
          } | ConvertTo-Json | Set-Content -Path phpmicro-timing.json -Encoding utf8

          @(
            "## phpmicro toolchain timing (windows-x86_64)"
            ""
            "| Measurement | Seconds |"
            "| --- | ---: |"
            "| Previous uncached baseline | $env:PHPMICRO_UNCACHED_BASELINE_SECONDS |"
            "| This run ($cacheMode) | $elapsedSeconds |"
            ""
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload spc build logs (always)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: windows-spc-logs
          path: |
            build/.tools/log/
            build/.tools/phpmicro-timing.json
          if-no-files-found: warn

      - name: Combine PHAR into standalone binary
        if: needs.resolve-release.outputs.cache_warm != 'true'
        shell: pwsh
        working-directory: build\.tools
        run: |
          .\spc.exe micro:combine ..\..\build\dw.phar `
            --output=..\..\build\dw-windows-x86_64.exe

      - name: Smoke test binary
        if: needs.resolve-release.outputs.cache_warm != 'true'
        shell: pwsh
        run: |
          .\build\dw-windows-x86_64.exe --version
          .\build\dw-windows-x86_64.exe runtime:check
          .\build\dw-windows-x86_64.exe list

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: needs.resolve-release.outputs.cache_warm != 'true'
        with:
          name: dw-windows-x86_64
          path: build/dw-windows-x86_64.exe
          if-no-files-found: error

  bundle-release:
    name: Bind exact release artifacts for publication
    needs: [resolve-release, release-preflight, build-phar, build-binary, build-binary-windows]
    if: >-
      needs.resolve-release.outputs.cache_warm != 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main') &&
      always() &&
      needs.resolve-release.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      needs.release-preflight.outputs.public_assets_present != 'true' &&
      needs.build-phar.result == 'success' &&
      needs.build-binary.result == 'success' &&
      needs.build-binary-windows.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      artifact-digest: ${{ steps.privileged-handoff.outputs.artifact-digest }}
      artifact-id: ${{ steps.privileged-handoff.outputs.artifact-id }}
      source-run-attempt: ${{ github.run_attempt }}
      source-run-id: ${{ github.run_id }}
    steps:
      - name: Restore the complete release artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: release-assets
          pattern: dw-*
          merge-multiple: true

      - name: Package the privileged release handoff as one immutable file
        run: tar -cf cli-release-handoff.tar -C release-assets .

      - name: Bind the privileged release handoff identity and digest
        id: privileged-handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          archive: false
          if-no-files-found: error
          path: cli-release-handoff.tar

  release:
    name: Publish Release
    # Every supported standalone platform must publish before the release
    # asset list, SHA256SUMS, installers, and public download endpoints are
    # considered complete.
    needs:
      - resolve-release
      - release-preflight
      - build-phar
      - build-binary
      - build-binary-windows
      - bundle-release
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    if: >-
      needs.resolve-release.outputs.cache_warm != 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == 'refs/heads/main') &&
      always() &&
      needs.resolve-release.result == 'success' &&
      needs.release-preflight.result == 'success' &&
      needs.release-preflight.outputs.public_assets_present != 'true' &&
      needs.build-phar.result == 'success' &&
      needs.build-binary.result == 'success' &&
      needs.build-binary-windows.result == 'success' &&
      needs.bundle-release.result == 'success'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the exact release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          artifact-ids: ${{ needs.bundle-release.outputs.artifact-id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          path: isolated-cli-release
          repository: ${{ github.repository }}
          run-id: ${{ needs.bundle-release.outputs.source-run-id }}

      - name: Validate the exact producer artifact before use
        env:
          ARTIFACT_DIRECTORY: isolated-cli-release
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.bundle-release.outputs.artifact-digest }}
          EXPECTED_ARTIFACT_ID: ${{ needs.bundle-release.outputs.artifact-id }}
          EXPECTED_SOURCE_RUN_ATTEMPT: ${{ needs.bundle-release.outputs.source-run-attempt }}
          EXPECTED_SOURCE_RUN_ID: ${{ needs.bundle-release.outputs.source-run-id }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'producer artifact digest is not an exact SHA-256 digest\n' >&2
            exit 1
          fi
          for identity in "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"; do
            if [[ ! "$identity" =~ ^[1-9][0-9]*$ ]]; then
              printf 'producer artifact identity is invalid\n' >&2
              exit 1
            fi
          done
          if [[ ! "$ARTIFACT_DIRECTORY" =~ ^isolated-[a-z0-9][a-z0-9._-]*$ ]]; then
            printf 'artifact validation directory is unsafe\n' >&2
            exit 1
          fi
          mapfile -d '' entries < <(
            /usr/bin/find "$ARTIFACT_DIRECTORY" -mindepth 1 -maxdepth 1 -print0
          )
          if [ "${#entries[@]}" -ne 1 ] || [ ! -f "${entries[0]}" ] || [ -L "${entries[0]}" ]; then
            printf 'artifact handoff must contain exactly one regular file\n' >&2
            exit 1
          fi
          observed_digest="$(/usr/bin/sha256sum "${entries[0]}")"
          observed_digest="${observed_digest%% *}"
          if [ "$observed_digest" != "$EXPECTED_ARTIFACT_DIGEST" ]; then
            printf 'artifact digest mismatch: expected %s, got %s\n' \
              "$EXPECTED_ARTIFACT_DIGEST" "$observed_digest" >&2
            exit 1
          fi
          printf 'validated artifact %s from run %s attempt %s\n' \
            "$EXPECTED_ARTIFACT_ID" "$EXPECTED_SOURCE_RUN_ID" "$EXPECTED_SOURCE_RUN_ATTEMPT"

      - name: Check out the exact release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve-release.outputs.commit }}

      - name: Checkout qualified release policy authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ needs.resolve-release.outputs.control_commit }}
          path: release-control
          persist-credentials: false

      - name: Resolve exact source identity
        env:
          EXPECTED_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$EXPECTED_COMMIT" ]; then
            printf 'release checkout %s does not match expected commit %s\n' \
              "$head_commit" "$EXPECTED_COMMIT" >&2
            exit 1
          fi

      - name: Extract the validated release handoff
        run: |
          mkdir dist
          tar -xf isolated-cli-release/cli-release-handoff.tar -C dist

      - name: Add installer scripts
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cp scripts/verify-release.sh dist/verify-release.sh

      - name: Validate release artifacts
        run: |
          set -euo pipefail
          required=(
            dw.phar
            dw-linux-x86_64
            dw-linux-aarch64
            dw-macos-aarch64
            dw-windows-x86_64.exe
            install.sh
            install.ps1
            verify-release.sh
          )
          for artifact in "${required[@]}"; do
            if [ ! -s "dist/$artifact" ]; then
              echo "::error::Missing required release artifact: $artifact"
              exit 1
            fi
          done

          sh -n dist/install.sh
          sh -n dist/verify-release.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw dist/install.ps1))'

      - name: Generate Homebrew formula
        run: scripts/generate-homebrew-formula.sh dist "${{ needs.resolve-release.outputs.tag }}"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      - name: Verify immutable release tag at publication boundary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
        run: release-control/scripts/ci/verify-release-tag-source.sh

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4
        with:
          subject-path: dist/*

      - name: Write release notes
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          cat > release-notes.md <<EOF
          Durable Workflow CLI ${tag}

          This release publishes the \`dw\` command-line client and its supported public distribution assets:

          - installer scripts for POSIX shells and PowerShell
          - the portable PHAR package
          - standalone binaries for Linux x86_64, Linux aarch64, macOS aarch64, and Windows x86_64
          - SHA256SUMS for artifact verification

          Download the assets below and verify them with the bundled \`verify-release.sh\` helper or your platform checksum tooling.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          name: ${{ needs.resolve-release.outputs.tag }}
          body_path: release-notes.md
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.resolve-release.outputs.prerelease }}
          make_latest: ${{ needs.resolve-release.outputs.make_latest }}

      - name: Verify public release downloads
        env:
          RELEASE_CONTROL_REF: ${{ needs.resolve-release.outputs.control_ref }}
          RELEASE_CONTROL_COMMIT: ${{ needs.resolve-release.outputs.control_commit }}
          RELEASE_INITIATOR: ${{ needs.resolve-release.outputs.initiator }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve-release.outputs.tag }}"
          tag="${tag#v}"
          release_repo="${DURABLE_WORKFLOW_REPO:-durable-workflow/cli}"
          attempts="${DURABLE_WORKFLOW_RELEASE_ASSET_ATTEMPTS:-12}"
          sleep_seconds="${DURABLE_WORKFLOW_RELEASE_ASSET_RETRY_SLEEP:-10}"

          case "$attempts" in
            ''|*[!0-9]*)
              echo "::error::DURABLE_WORKFLOW_RELEASE_ASSET_ATTEMPTS must be a positive integer"
              exit 1
              ;;
          esac
          case "$sleep_seconds" in
            ''|*[!0-9]*)
              echo "::error::DURABLE_WORKFLOW_RELEASE_ASSET_RETRY_SLEEP must be a non-negative integer"
              exit 1
              ;;
          esac
          if [ "$attempts" -lt 1 ]; then
            echo "::error::DURABLE_WORKFLOW_RELEASE_ASSET_ATTEMPTS must be at least 1"
            exit 1
          fi

          public_asset_url() {
            printf 'https://github.com/%s/releases/download/%s/%s' "$release_repo" "$tag" "$1"
          }

          wait_for_asset() {
            asset="$1"
            url="$(public_asset_url "$asset")"
            attempt=1

            while [ "$attempt" -le "$attempts" ]; do
              if curl -fsSLI --retry 3 --retry-all-errors --connect-timeout 10 "$url" >/dev/null; then
                printf '%s: OK\n' "$asset"
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                printf 'Waiting for public release asset (%s/%s): %s\n' "$attempt" "$attempts" "$asset" >&2
                sleep "$sleep_seconds"
              fi

              attempt=$((attempt + 1))
            done

            echo "::error::Public release asset is not downloadable: $url"
            return 1
          }

          public_assets=(
            dw.phar
            dw-linux-x86_64
            dw-linux-aarch64
            dw-macos-aarch64
            dw-windows-x86_64.exe
            dw.rb
            install.sh
            install.ps1
            verify-release.sh
            SHA256SUMS
          )

          for asset in "${public_assets[@]}"; do
            wait_for_asset "$asset"
          done

          evidence="release-public-download-evidence.json"
          release_commit="$(git rev-parse HEAD)"
          verified_at="$(date -u +%FT%TZ)"
          {
            printf '{\n'
            printf '  "tag": "%s",\n' "$tag"
            printf '  "commit": "%s",\n' "$release_commit"
            printf '  "initiator": "%s",\n' "$RELEASE_INITIATOR"
            printf '  "control": {"ref": "%s", "commit": "%s"},\n' \
              "$RELEASE_CONTROL_REF" "$RELEASE_CONTROL_COMMIT"
            printf '  "artifact_versions": {"cli": "%s"},\n' "$tag"
            printf '  "installable_artifacts": {"verified_public_downloads": true, "version": "%s"},\n' "$tag"
            printf '  "verified_at": "%s",\n' "$verified_at"
            printf '  "outcome": "pass",\n'
            printf '  "assets": [\n'
            last_index=$((${#public_assets[@]} - 1))
            for i in "${!public_assets[@]}"; do
              asset="${public_assets[$i]}"
              comma=","
              if [ "$i" -eq "$last_index" ]; then
                comma=""
              fi
              printf '    {"name": "%s", "url": "%s"}%s\n' "$asset" "$(public_asset_url "$asset")" "$comma"
            done
            printf '  ]\n'
            printf '}\n'
          } > "$evidence"

          installer="$(mktemp)"
          install_dir="$(mktemp -d)"
          default_install_dir="$(mktemp -d)"
          channel_evidence="$(mktemp)"
          trap 'rm -rf "$installer" "$install_dir" "$default_install_dir" "$channel_evidence"' EXIT
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 \
            -o "$installer" "$(public_asset_url install.sh)"
          export PATH="$install_dir:$default_install_dir:$PATH"
          VERSION="$tag" DURABLE_WORKFLOW_INSTALL_DIR="$install_dir" \
            DURABLE_WORKFLOW_INSTALL_OUTPUT=json \
            DURABLE_WORKFLOW_RELEASE_BASE_URL="https://github.com/${release_repo}/releases" \
            DURABLE_WORKFLOW_BIN_NAME=dw-release-check sh "$installer"
          command -v dw-release-check
          dw-release-check --version

          node scripts/ci/verify-cli-release-channel.js --release-tag "$tag" \
            | tee "$channel_evidence"
          channel_version="$(jq -r '.channel_version' "$channel_evidence")"

          DURABLE_WORKFLOW_INSTALL_DIR="$default_install_dir" \
            DURABLE_WORKFLOW_RELEASE_BASE_URL="https://github.com/${release_repo}/releases" \
            DURABLE_WORKFLOW_BIN_NAME=dw-channel-check sh scripts/install.sh
          default_version="$("$default_install_dir/dw-channel-check" --version)"
          case "$default_version" in
            *"$channel_version"*) ;;
            *)
              echo "::error::Default installer resolved ${default_version}, expected channel ${channel_version}"
              exit 1
              ;;
          esac

          upgrade_dry_run_evidence="$("$install_dir/dw-release-check" upgrade --dry-run --output=json)"
          printf '%s\n' "$upgrade_dry_run_evidence" | node scripts/ci/verify-cli-upgrade-result.js \
            --mode dry-run --release-version "$tag" --channel-version "$channel_version"

          upgrade_apply_evidence="$("$install_dir/dw-release-check" upgrade --output=json)"
          printf '%s\n' "$upgrade_apply_evidence" | node scripts/ci/verify-cli-upgrade-result.js \
            --mode apply --release-version "$tag" --channel-version "$channel_version"

      - name: Verify live docs release audit after public downloads
        env:
          DOCS_RELEASE_AUDIT_ARTIFACT: cli
          DOCS_RELEASE_AUDIT_VERSION: ${{ needs.resolve-release.outputs.tag }}
          DOCS_RELEASE_AUDIT_EVIDENCE: docs-release-audit-evidence.json
          DOCS_RELEASE_AUDIT_HANDOFF: docs-release-audit-handoff.json
          DOCS_RELEASE_AUDIT_STALE_MODE: advisory
        run: release-control/scripts/ci/check-docs-release-audit.sh

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: release-evidence
          path: |
            release-public-download-evidence.json
            docs-release-audit-evidence.json
            docs-release-audit-handoff.json
          if-no-files-found: warn
