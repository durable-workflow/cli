name: Build

on:
  push:
    branches: [main, maintenance/2.3.6-base]
  pull_request:
    branches: [main, maintenance/2.3.6-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-policy:
    name: Central action policy preflight
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check out central action policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: main
          path: .central-action-policy
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Bootstrap patched pip trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
      - name: Install policy dependencies
        run: >-
          python -m pip install --only-binary :all: PyYAML==6.0.2
      - name: Require centrally approved immutable action commits
        run: >-
          python .central-action-policy/scripts/qualification_policy.py validate
          --policy .central-action-policy/qualification/policy.json
          --target cli
          --workflow-directory .github/workflows

  test:
    name: Test (PHP ${{ matrix.php }})
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, posix
          tools: composer:2.10.3
          coverage: none
      - name: Verify actual Composer dependency trust
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
      - run: composer install --prefer-dist --no-interaction
      - name: Validate installer scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/generate-homebrew-formula.sh
          sh -n scripts/verify-release.sh
          node --check scripts/ci/release-version.js
          node --check scripts/ci/verify-cli-release-channel.js
          node --check scripts/ci/verify-cli-upgrade-result.js
          node --check scripts/ci/verify-standalone-runtime.js
          node --check scripts/ci/verify-standalone-dependencies.js
          php -l scripts/ci/probe-standalone-runtime.php
          bash -n scripts/ci/verify-release-tag-source.sh
          bash -n scripts/ci/establish-native-prerequisites.sh
          bash -n scripts/ci/reconcile-release-metadata.sh
          bash -n scripts/verify-public-release-assets.sh
          bash -n scripts/verify-reproducible-build.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1))'
      - name: Verify release contracts
        run: |
          python -m pip install --only-binary :all: PyYAML==6.0.2
          python scripts/ci/test-release-cache-policy.py
          python scripts/ci/test-sonar-wait-routing.py
          python scripts/ci/test-native-prerequisites.py
          node --test scripts/ci/test-release-workflow-metadata.js
          node --test scripts/ci/test-installed-release.js
          node --test scripts/ci/test-upgrade-smoke.js
          node --test scripts/ci/test-installer-pinned-download.js
          DW_TEST_PHP_BINARY="$(command -v php)" node --test scripts/ci/test-phar-metadata.js
          pwsh -NoProfile -File scripts/ci/test-windows-installer-path.ps1
          pwsh -NoProfile -File scripts/ci/test-windows-installer-digest.ps1
          node --test scripts/ci/test-standalone-runtime.js
          node --test scripts/ci/test-standalone-dependencies.js
          node --test scripts/ci/test-cli-release-channel.js
          node --test scripts/ci/test-cli-upgrade-result.js
          node --test scripts/ci/test-release-metadata.js
      - name: Reverify Composer before project scripts
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
      - run: composer test

  verifier-inputs:
    name: Verifier source inputs (${{ matrix.name }})
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-15
          - name: windows-x86_64
            runner: windows-2022
    env:
      VERIFIER_PHP_SERIES: '8.4'
      VERIFIER_PLATFORM: ${{ matrix.name }}
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
      GH_ENTERPRISE_TOKEN: ''
      GITHUB_ENTERPRISE_TOKEN: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Establish trusted verifier PHP
        id: verifier-php
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.VERIFIER_PHP_SERIES }}
          extensions: phar
          tools: none
          coverage: none
        env:
          fail-fast: 'true'
      - name: Capture exact verifier PHP authority
        id: verifier-php-authority
        env:
          BOOTSTRAPPED_PHP_VERSION: ${{ steps.verifier-php.outputs.php-version }}
        run: node scripts/ci/run-public-release-verifier.mjs authority
      - name: Check native tools, immutable Git bytes and synthetic failure evidence
        env:
          VERIFIER_PHP_AUTHORITY: ${{ steps.verifier-php-authority.outputs.authority }}
          DW_REQUIRE_NATIVE_VERIFIER_AUTHORITY: '1'
        run: node --test --test-concurrency=2 scripts/ci/test-verifier-inputs.js

  build-phar:
    name: Build PHAR (smoke test)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3, box:4.6.6
          coverage: none
          ini-values: phar.readonly=0
      - run: php scripts/generate-build-info.php
      - name: Verify actual Composer dependency trust
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - run: box compile --no-parallel
      - name: Verify the actual source-built PHAR package inventory
        run: DW_TEST_PHP_BINARY="$(command -v php)" DW_TEST_PRODUCTION_PHAR=build/dw.phar node --test scripts/ci/test-phar-metadata.js
      - run: box info build/dw.phar
      - run: php build/dw.phar list

  reproducible-build:
    name: Reproducible build (PHAR is bit-identical across rebuilds)
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.4'
          tools: composer:2.10.3, box:4.6.6
          coverage: none
          ini-values: phar.readonly=0
      - name: Verify actual Composer dependency trust
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
      - name: Verify dw.phar reproduces bit-for-bit
        run: scripts/verify-reproducible-build.sh

  target-branch-qualification:
    name: Target branch qualification
    if: ${{ always() && github.server_url == 'https://github.com' }}
    needs: [action-policy, test, verifier-inputs, build-phar, reproducible-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require central action policy preflight
        if: ${{ github.server_url == 'https://github.com' }}
        env:
          ACTION_POLICY_RESULT: ${{ needs.action-policy.result }}
        run: test "$ACTION_POLICY_RESULT" = success

      - name: Require every build cell
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PHAR_RESULT: ${{ needs.build-phar.result }}
          REPRODUCIBLE_RESULT: ${{ needs.reproducible-build.result }}
          VERIFIER_INPUTS_RESULT: ${{ needs.verifier-inputs.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$PHAR_RESULT" = success
          test "$REPRODUCIBLE_RESULT" = success
          test "$VERIFIER_INPUTS_RESULT" = success
