# Proposed caller. Activate only after exact central source admission.
jobs:
  reproducible-build:
    name: Reproducible build (PHAR is bit-identical across rebuilds)
    needs: [action-policy]
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.13'
      - name: Bootstrap verified dependency trust
        uses: durable-workflow/.github/.github/actions/bootstrap-patched-pip@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
        with:
          clients: pip,python,composer,curl,git
      - name: Disable APT download retries (CVE-2026-109518)
        run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
      - name: Check out the accepted PHP container build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          repository: durable-workflow/.github
          ref: 18783be6bef737cc778e4c7282a8797e39daa61a
          path: .central-apt-source
          persist-credentials: false
      - name: Build and prepare the pinned PHP reproducibility profile
        run: bash "$GITHUB_WORKSPACE/scripts/ci/setup-php-repro-container.sh"
      - name: Verify actual Composer dependency trust
        uses: durable-workflow/.github/.github/actions/verify-composer-trust@75587fc33ff40c34f32ef777293dad56bb6f48c7  # clean-trust
      - name: Verify dw.phar reproduces bit-for-bit
        run: scripts/ci/verify-php-reproducible-build.sh
